# The web docs on GitHub Pages: site/ built fresh from the docs (tools/site/build.py, standard
# library only) on every push to main that touches them, then deployed.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/site/**"
      - "tools/boot-ui/font.h"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site/
        run: python tools/site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
