# BasedOS boot keys: hold a button while powering on to choose what this boot does. Read once a
# boot by frontend-session. To change it, copy this file to /data/boot-keys.conf (over SSH, from
# maintenance mode for instance) and edit that copy; it replaces this one.
#
# One per line, "<button> <action> [argument]"; when several listed buttons are held, the first
# line wins. Actions:
#   maintenance          no frontend this boot: Wi-Fi and SSH only
#   frontend <entry>     start <entry> on the card instead of the first one found, e.g.
#                        System/frontend, System/launch_frontend.sh, spruce/scripts/runtime.sh,
#                        .tmp_update/updater, or any script or program on the card
# Buttons, as labelled: a b x y l1 r1 l2 r2 l3 select start menu f1 up down left right
# volup voldown
select maintenance
